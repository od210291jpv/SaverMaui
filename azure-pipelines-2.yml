trigger:
  - master
  - feature/*

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Debug' # Рекомендую змінити на 'Release' для Raspberry Pi

stages:
- stage: BuildApplication
  jobs:
  - job: buildJob
    timeoutInMinutes: 10
    pool:
      name: MyPool
      demands: 
      - dotnet
      - nunit-console
    steps:
    - task: DotNetCoreCLI@2
      displayName: 'Publish Backend for Raspberry Pi'
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'SaverBackend/SaverBackend.csproj'
        arguments: '-c $(buildConfiguration) -r linux-arm /p:PublishSingleFile=true --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'BuildDrop'
        publishLocation: 'pipeline'