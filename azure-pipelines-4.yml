trigger: none

resources:
  pipelines:
  - pipeline: BuildPipeline              
    source: 'SaverBackend - build only' 
    trigger: true                       

jobs:
- deployment: DeployToRaspberryPi
  timeoutInMinutes: 0
  displayName: 'Deploy Backend to Pi'
  pool: 
    name: 'MyPool' 
  environment: 'Production'
  strategy:
    runOnce:
      deploy:
        steps:
        - script: |
            echo "Stopping Bananas service..."
            sudo service bananas stop
            
            echo "Cleaning up old files..."
            sudo rm -rf /var/www/saverbackend/BuildDrop/Debug/net6.0/*
            
            echo "Unzipping the new build..."
            sudo unzip -q -o $(Pipeline.Workspace)/BuildPipeline/BuildDrop/BuildDrop.zip -d /var/www/saverbackend/BuildDrop/Debug/net6.0/
            
            echo "Restoring libtensorflow..."
            sudo cp /var/www/libtensorflow.so /var/www/saverbackend/BuildDrop/Debug/net6.0/
            
            echo "Restarting services..."
            sudo service redis-server start
            sudo service nginx restart
            sudo service bananas restart
          displayName: 'Execute Deployment Script'